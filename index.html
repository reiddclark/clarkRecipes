<body><a class="skip" href="#main">Skip to content</a><header class="top"><div class="shell mast"><a class="brand" href="#" aria-label="Clark Family Cookbook home">Clark Family Cookbook</a><nav class="mode-nav" aria-label="Recipe navigation"><a href="#" id="home-link">Search</a><a href="#categories" id="category-link">Browse</a></nav></div></header>
